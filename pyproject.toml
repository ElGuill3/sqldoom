[project]
name = "sqldoom"
version = "0.1.0"
description = "Doom running inside DuckDB, built from scratch."
requires-python = ">=3.12,<3.14"
dependencies = ["duckdb>=1.1"]

[project.scripts]
sqldoom-import = "sqldoom.cli:main"
sqldoom-automap = "sqldoom.automap:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqldoom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
